[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lara-transformer"
version = "0.1.0"
description = "A bidirectional encoder-only Transformer in PyTorch"
readme = "README.md"
requires-python = ">=3.10"
    dependencies = ["numpy>=1.23", "torch>=2.0", "safetensors>=0.4"]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    "ruff>=0.5,<1.0",
]

[tool.setuptools]
py-modules = ["lara"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
